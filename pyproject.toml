[project]
name = "config-sailor"
version = "0.4.0"
description = "A lightweight config distribution service with document-level JSON patching, enabling dynamic, server-side transformation and delivery using minimal, GET-only clients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "fastapi",
    "uvicorn",
    "argon2-cffi",
    "cryptography",
    "packaging",
    "portalocker",
    "typing_extensions"
]

[project.scripts]
config-sailor = "config_sailor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
